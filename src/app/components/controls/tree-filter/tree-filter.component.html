<input matInput
  [ngStyle]="!isFilterLine && {'display': 'none'} || {}"
  type="text"
  autocomplete="off"
  class="field-input field-sticky"
  type="text"
  placeholder="Apply a field filter"
  [(ngModel)]="textFilterTree"
  (keyup)="onKeyUpFilterTree()"
  matTooltip="Use symbol || (logical OR) for multiple filtering, EXAMPLE: point1||point2||point3">
<div class="field-sticky color">
  <ng-container *ngTemplateOutlet="highlighted; context: { $implicit: textFilterTree, redial: true }"></ng-container>
</div>
<ng-template #highlighted let-text let-redial="redial">
  <ng-container *ngFor="let part of highlight(text, redial)">
    <span *ngIf="part.match"
      [style.background-color]="part.color"
      [style.color]="part.textColor"
      [style.border-radius]="part.radius">{{ part.text }}</span>
    <ng-container *ngIf="!part.match">{{ part.text }}</ng-container>
  </ng-container>
</ng-template>
<mat-tree [dataSource]="dataSource"
  [treeControl]="treeControl"
  #tree>
  <mat-tree-node *matTreeNodeDef="let node"
    [style.display]="treeFilter(node) ? 'flex' : 'none'"
    [class.selected]="isSelectedHexArray(node)"
    [class.menu]="noPadding"
    class="filter-tree-node"
    [matTreeNodePaddingIndent]="noPadding ? 0 : 20"
    [style.background-color]="noPadding && 'rgba(0,0,0,' + ( (2.5 - node.level) / 12) + ')'"
    matTreeNodePadding>
    <button mat-icon-button
      disabled></button>
    <mat-icon *ngIf="fileIcon"
      class="files file"
      color="primary">insert_drive_file </mat-icon>
    <span class="line-html"
      (click)="onClickLine(node)">
      <ng-container *ngTemplateOutlet="highlighted; context: { $implicit: node.name }"></ng-container>
      <span class="tree-suffix" *ngIf="node.suffix">
        <ng-container *ngTemplateOutlet="highlighted; context: { $implicit: node.suffix }"></ng-container>
      </span>
    </span>
    <button mat-icon-button
      *ngIf="isFilter"
      (click)="setFilterGrid(node.description)">
      <mat-icon class="mat-icon-rtl-mirror">filter_list</mat-icon>
    </button>
  </mat-tree-node>
  <mat-tree-node *matTreeNodeDef="let node; when: hasChild"
    [style.display]="treeFilter(node) ? 'flex' : 'none'"
    class="filter-tree-node"
    [class.selected]="isSelectedHexArray(node)"
    [class.menu]="noPadding"
    [matTreeNodePaddingIndent]="noPadding ? 0 : 20"
    [style.background-color]="noPadding && 'rgba(0,0,0,' + ( (2.5 - node.level) / 12) + ')'"
    matTreeNodePadding>
    <button mat-icon-button
      matTreeNodeToggle
      [attr.aria-label]="'Toggle ' + node.name + (node.suffix || '')">
      <mat-icon class="mat-icon-rtl-mirror">
        {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
      </mat-icon>
    </button>
    <mat-icon *ngIf="fileIcon"
      class="files"
      color="primary">folder</mat-icon>
    <span class="line-html"
      matTreeNodeToggle
      [attr.aria-label]="'Toggle ' + node.name + (node.suffix || '')"
      (click)="onClickLine(node)">
      <ng-container *ngTemplateOutlet="highlighted; context: { $implicit: node.name }"></ng-container>
      <span class="tree-suffix" *ngIf="node.suffix">
        <ng-container *ngTemplateOutlet="highlighted; context: { $implicit: node.suffix }"></ng-container>
      </span>
    </span>
    <button mat-icon-button
      *ngIf="isFilter"
      (click)="setFilterGrid(node.description)">
      <mat-icon class="mat-icon-rtl-mirror">filter_list</mat-icon>
    </button>

  </mat-tree-node>

</mat-tree>
